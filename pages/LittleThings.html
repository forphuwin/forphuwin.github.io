<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phuwin's Corner - Little Things</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Montserrat & Playfair Display -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Playfair+Display:ital,wght@1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Montserrat', 'sans-serif'],
                        'serif-italic': ['Playfair Display', 'serif'],
                    },
                    keyframes: {
                        floatGentle: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-6px)' },
                        }
                    },
                    animation: {
                        'float-gentle': 'floatGentle 4s ease-in-out infinite',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #090820;
            font-family: 'Montserrat', sans-serif;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Gradasi gelap di bagian bawah agar teks dan tombol kontras & elegan */
        .bg-bottom-fade {
            background: linear-gradient(180deg, rgba(9, 8, 32, 0) 30%, rgba(15, 7, 32, 0.75) 60%, #130728 100%);
        }
    </style>
</head>
<!-- UBAH: h-screen menjadi h-[100dvh] -->
<body class="h-[100dvh] w-full flex items-center justify-center p-0 overflow-hidden antialiased select-none">

    <!-- BINGKAI MOCKUP HP -->
    <!-- UBAH: h-screen menjadi h-[100dvh] -->
    <div class="relative w-full sm:w-[410px] h-[100dvh] bg-[#130728] shadow-[0_0_60px_rgba(112,48,239,0.4)] sm:border-x sm:border-white/10 shrink-0 overflow-hidden flex flex-col">
        
        <!-- SIDEBAR DRAWER & OVERLAY -->
        <div id="sidebarOverlay" class="absolute inset-0 bg-black/60 backdrop-blur-xs opacity-0 pointer-events-none transition-opacity duration-300 z-40"></div>

        <div id="sidebar" class="absolute top-0 left-0 w-[80%] h-full bg-gradient-to-b from-[#E800FF] via-[#a223fa] to-[#7030EF] text-white p-5 pt-8 z-50 transform -translate-x-full transition-transform duration-300 ease-in-out rounded-r-[32px] shadow-2xl flex flex-col justify-between overflow-hidden">
            <div>
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xs font-extrabold tracking-wider text-white/90">PHUWIN'S CORNER</h2>
                    <button id="closeSidebarBtn" class="w-8 h-8 rounded-full bg-white/20 hover:bg-white/30 text-white flex items-center justify-center active:scale-90 transition-all">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <div class="w-full h-[1px] bg-white/20 mb-6"></div>

                <nav class="space-y-2.5">
                    <a href="../pages/foryou.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-white/90 font-semibold text-xs hover:bg-white/10 hover:translate-x-1 transition-all">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                        <span>For you</span>
                    </a>
                    <a href="../pages/listenWithMe.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-white/90 font-semibold text-xs hover:bg-white/10 hover:translate-x-1 transition-all">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                        <span>Listen with me</span>
                    </a>
                    <a href="../pages/LittleThings.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl bg-white text-[#7030EF] font-bold text-xs shadow-md transform hover:translate-x-1 transition-all">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="#7030EF"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                        <span>Little things</span>
                    </a>
                </nav>
            </div>

            <div class="pb-4 flex items-center gap-2">
                <span class="text-2xl font-black tracking-tighter text-white">phuwin</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="#FFE600" class="animate-spin" style="animation-duration: 8s;">
                    <path d="M12 2 L14.5 9.5 L22 12 L14.5 14.5 L12 22 L9.5 14.5 L2 12 L9.5 9.5 Z"/>
                </svg>
            </div>
        </div>

        <!-- NAVBAR FIXED (TOMBOL HAMBURGER) -->
        <div class="absolute top-0 left-0 w-full z-30 p-5 pt-7 flex items-center justify-start pointer-events-none">
            <button id="openSidebarBtn" class="pointer-events-auto group p-2.5 rounded-xl bg-black/30 backdrop-blur-md border border-white/10 hover:bg-white/20 active:scale-95 transition-all duration-300">
                <svg width="22" height="16" viewBox="0 0 24 18" fill="none">
                    <rect y="0" width="24" height="2.5" rx="1.25" fill="white" class="group-hover:translate-x-1 transition-transform"/>
                    <rect y="7.5" width="17" height="2.5" rx="1.25" fill="white"/>
                    <rect y="15" width="24" height="2.5" rx="1.25" fill="white" class="group-hover:translate-x-1 transition-transform"/>
                </svg>
            </button>
        </div>

        <!-- KONTEN UTAMA PAGE 4 -->
        <div class="relative w-full h-full flex flex-col justify-end overflow-hidden">
            
            <!-- FOTO KARAKTER SEBAGAI BACKGROUND FULL -->
            <div class="absolute inset-0 w-full h-full z-0">
                <img src="../assets/background-page-4.png" alt="Phuwin" class="w-full h-full object-cover object-top scale-105">
            </div>

            <!-- LAPISAN GRADASI BAWAH AGAR TEKS TERBACA JELAS -->
            <div class="absolute inset-0 bg-bottom-fade pointer-events-none z-10"></div>

            <!-- KONTEN TEKS & TOMBOL DI BAGIAN BAWAH -->
            <div class="relative z-20 px-6 pb-10 flex flex-col items-center text-center">
                
                <!-- Judul Utama -->
                <h1 class="font-serif-italic italic font-bold text-[26px] sm:text-[28px] text-white leading-tight drop-shadow-lg mb-3">
                    A Little Something<br>From You
                </h1>

                <!-- Deskripsi -->
                <p class="font-sans text-[12.5px] sm:text-[13.5px] text-white/90 leading-relaxed max-w-[320px] mb-8 drop-shadow-md font-medium">
                    I left three little questions for you.<br>
                    No pressure, just answer whatever comes<br>
                    to mind, and answer them whenever you<br>
                    have a moment.
                </p>

                <!-- Tombol Continue -->
                <a href="quetion.html" class="w-full max-w-[340px] py-3.5 rounded-full bg-gradient-to-r from-[#d91ad1] via-[#aa1ced] to-[#6c0fec] border border-white/30 text-white font-bold text-[14px] shadow-[0_8px_25px_rgba(217,26,209,0.5)] hover:scale-[1.02] active:scale-95 transition-all duration-300 flex items-center justify-center">
                    Continue
                </a>

            </div>

        </div>
    </div>

    <!-- JAVASCRIPT LOGIC SIDEBAR -->
    <script>
        const openSidebarBtn = document.getElementById('openSidebarBtn');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        function openSidebar() {
            sidebar.classList.remove('-translate-x-full');
            sidebarOverlay.classList.remove('opacity-0', 'pointer-events-none');
            sidebarOverlay.classList.add('opacity-100');
        }

        function closeSidebar() {
            sidebar.classList.add('-translate-x-full');
            sidebarOverlay.classList.remove('opacity-100');
            sidebarOverlay.classList.add('opacity-0', 'pointer-events-none');
        }

        openSidebarBtn.addEventListener('click', openSidebar);
        closeSidebarBtn.addEventListener('click', closeSidebar);
        sidebarOverlay.addEventListener('click', closeSidebar);
    </script>
</body>
</html>
