<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phuwin's Corner - A Little Things</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Montserrat', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #090820;
            font-family: 'Montserrat', sans-serif;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .custom-input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            color: white;
            transition: all 0.3s ease;
        }

        .custom-input::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        .custom-input:focus {
            outline: none;
            border-color: rgba(229, 34, 208, 0.8);
            box-shadow: 0 0 15px rgba(229, 34, 208, 0.3);
            background: rgba(255, 255, 255, 0.12);
        }

        #particleContainer {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 20;
        }

        .particle {
            position: absolute;
            top: -20px;
            border-radius: 50%;
            pointer-events: none;
            animation: particleFall linear forwards;
        }

        .particle.small {
            width: 3px;
            height: 3px;
        }

        .particle.medium {
            width: 5px;
            height: 5px;
        }

        .particle.large {
            width: 7px;
            height: 7px;
        }

        .particle.star {
            width: 6px;
            height: 6px;
            border-radius: 0;
            background: transparent !important;
        }

        .particle.star::before {
            content: "✦";
            position: absolute;
            color: white;
            font-size: 10px;
            line-height: 1;
            text-shadow:
                0 0 5px rgba(255,255,255,.9),
                0 0 10px rgba(217,26,209,.8);
        }

        .particle.glow {
            box-shadow:
                0 0 5px rgba(255,255,255,.8),
                0 0 10px rgba(229,34,208,.5);
        }

        @keyframes particleFall {
            0% {
                transform: translate3d(0, -20px, 0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: .9;
            }

            30% {
                transform: translate3d(15px, 30vh, 0) rotate(90deg);
            }

            55% {
                transform: translate3d(-15px, 60vh, 0) rotate(180deg);
            }

            80% {
                transform: translate3d(20px, 85vh, 0) rotate(270deg);
            }

            100% {
                transform: translate3d(-10px, 110vh, 0) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body class="h-[100dvh] w-full flex items-center justify-center p-0 overflow-hidden antialiased select-none">

    <div class="relative w-full sm:w-[410px] h-[100dvh] bg-gradient-to-b from-[#381163] via-[#210942] to-[#120526] shadow-[0_0_60px_rgba(112,48,239,0.4)] sm:border-x sm:border-white/10 shrink-0 overflow-hidden flex flex-col">

        <div class="relative w-full px-5 pt-7 pb-4 flex items-center justify-between z-20 shrink-0">

            <a href="LittleThings.html" class="p-2 rounded-xl text-white/90 hover:bg-white/10 active:scale-95 transition-all">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </a>

            <h1 class="absolute left-1/2 -translate-x-1/2 text-white font-bold text-[15px] tracking-wide">
                A little things
            </h1>

            <div class="w-9"></div>
        </div>

        <form id="questionForm" onsubmit="handleFormSubmit(event)" class="w-full h-full flex flex-col justify-between relative z-10 overflow-hidden">

            <div class="w-full h-full overflow-y-auto no-scrollbar px-6 pt-2 pb-24 flex flex-col gap-6">

                <div class="flex flex-col gap-2">
                    <label class="text-white font-medium text-[13.5px] leading-snug">
                        If you could describe Indonesia in one word, what would it be?
                    </label>

                    <input
                        type="text"
                        id="input1"
                        placeholder="Write here..."
                        required
                        class="w-full h-[48px] px-4 rounded-[16px] text-[13px] custom-input">
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-white font-medium text-[13.5px] leading-snug">
                        Is there a song you’d like me to listen to?
                    </label>

                    <input
                        type="text"
                        id="input2"
                        placeholder="Write here..."
                        required
                        class="w-full h-[48px] px-4 rounded-[16px] text-[13px] custom-input">
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-white font-medium text-[13.5px] leading-snug">
                        Is there something you’d like to say to the person who made this for you?
                    </label>

                    <textarea
                        id="input3"
                        placeholder="Write here..."
                        rows="5"
                        required
                        class="w-full p-4 rounded-[16px] text-[13px] custom-input resize-none"></textarea>
                </div>

            </div>

            <div class="absolute bottom-0 left-0 w-full p-6 bg-gradient-to-t from-[#120526] via-[#120526]/90 to-transparent z-20 flex justify-center">

                <button
                    type="submit"
                    id="submitBtn"
                    class="w-full max-w-[340px] py-3.5 rounded-full bg-gradient-to-r from-[#d91ad1] via-[#aa1ced] to-[#6c0fec] border border-white/30 text-white font-bold text-[14px] shadow-[0_8px_25px_rgba(217,26,209,0.5)] hover:scale-[1.02] active:scale-95 transition-all duration-300 flex items-center justify-center">

                    <span id="btnText">Submit</span>

                </button>

            </div>

        </form>

        <div
            id="successPopup"
            class="absolute inset-0 bg-black/70 backdrop-blur-xs opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center justify-center p-5">

            <div
                id="popupCard"
                class="w-full max-w-[320px] bg-white rounded-[28px] p-6 flex flex-col items-center text-center shadow-2xl transform scale-95 transition-transform duration-300 relative z-10">

                <div class="w-40 h-40 mb-2 flex items-center justify-center">
                    <img
                        src="../assets/character-popup-page4.png"
                        alt="Mascot"
                        class="w-full h-full object-contain drop-shadow-md">
                </div>

                <h2 class="text-[#8c1be6] font-extrabold text-[22px] mb-2 tracking-tight">
                    Thank you, Phuwin!
                </h2>

                <p class="text-[#4a4a4a] text-[12.5px] leading-relaxed font-medium mb-6 px-2">
                    I'll keep your words as a little memory from today.
                </p>

                <a
                    href="foryou.html"
                    onclick="stopParticles()"
                    class="w-full py-3.5 rounded-full bg-gradient-to-r from-[#d91ad1] via-[#aa1ced] to-[#6c0fec] text-white font-bold text-[13.5px] shadow-[0_6px_20px_rgba(217,26,209,0.4)] hover:brightness-110 active:scale-95 transition-all flex items-center justify-center">

                    Back to homepage

                </a>

            </div>

            <div id="particleContainer"></div>

        </div>

    </div>

    <script>
        const WEB_APP_URL =
            'https://script.google.com/macros/s/AKfycbwTVOV2HDoiGTvfGXmIwkRUDLxcor9iLWxP-kMxKaVK1w-Z-SK_aT61gb70e3y7P7dZ/exec';

        const form = document.getElementById('questionForm');
        const successPopup = document.getElementById('successPopup');
        const popupCard = document.getElementById('popupCard');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const particleContainer = document.getElementById('particleContainer');

        let particleInterval = null;

        function createParticle() {
            const particle = document.createElement('div');

            particle.classList.add('particle');

            const sizes = ['small', 'medium', 'large'];
            particle.classList.add(
                sizes[Math.floor(Math.random() * sizes.length)]
            );

            if (Math.random() < 0.12) {
                particle.classList.add('star');
            }

            if (Math.random() < 0.35) {
                particle.classList.add('glow');
            }

            particle.style.left = Math.random() * 100 + '%';

            const duration = 3 + Math.random() * 4;
            particle.style.animationDuration = duration + 's';

            particle.style.animationDelay =
                Math.random() * 0.5 + 's';

            particle.style.opacity =
                0.4 + Math.random() * 0.6;

            const colors = [
                '#ffffff',
                '#f9d9ff',
                '#ead7ff',
                '#ffd9fa',
                '#e7c7ff'
            ];

            particle.style.background =
                colors[Math.floor(Math.random() * colors.length)];

            particleContainer.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, (duration + 1) * 1000);
        }

        function startParticles() {
            particleContainer.innerHTML = '';

            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    createParticle();
                }, i * 70);
            }

            particleInterval = setInterval(() => {
                createParticle();
            }, 130);
        }

        function stopParticles() {
            if (particleInterval) {
                clearInterval(particleInterval);
                particleInterval = null;
            }

            particleContainer.innerHTML = '';
        }

        function handleFormSubmit(event) {
            event.preventDefault();

            const val1 = document.getElementById('input1').value.trim();
            const val2 = document.getElementById('input2').value.trim();
            const val3 = document.getElementById('input3').value.trim();

            if (val1 === '' || val2 === '' || val3 === '') {
                alert('Harap isi semua kolom pertanyaan terlebih dahulu!');
                return;
            }

            submitBtn.style.opacity = "0.8";
            submitBtn.style.pointerEvents = "none";

            btnText.innerHTML = `
                <svg
                    class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline-block"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24">

                    <circle
                        class="opacity-25"
                        cx="12"
                        cy="12"
                        r="10"
                        stroke="currentColor"
                        stroke-width="4">
                    </circle>

                    <path
                        class="opacity-75"
                        fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z">
                    </path>
                </svg>

                Sending...
            `;

            const formData = {
                description: val1,
                song: val2,
                message: val3
            };

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(() => {

                submitBtn.style.opacity = "1";
                submitBtn.style.pointerEvents = "auto";
                btnText.innerText = "Submit";

                successPopup.classList.remove(
                    'opacity-0',
                    'pointer-events-none'
                );

                successPopup.classList.add('opacity-100');

                popupCard.classList.remove('scale-95');
                popupCard.classList.add('scale-100');

                startParticles();
            })
            .catch(error => {

                console.error('Error:', error);

                alert(
                    'Terjadi kesalahan saat mengirim data. Coba lagi ya!'
                );

                submitBtn.style.opacity = "1";
                submitBtn.style.pointerEvents = "auto";
                btnText.innerText = "Submit";
            });
        }
    </script>

</body>
</html>
